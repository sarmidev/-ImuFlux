<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#121212">
    <title>ImuFlux Diagnostics</title>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #121212;
            touch-action: manipulation;
            -webkit-text-size-adjust: 100%;
        }
        /* Soft keyboard / Safari: keep the compose root filling the visual viewport */
        #ComposeTarget, canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
</head>

</body>
</html>
