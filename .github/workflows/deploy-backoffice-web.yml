name: Deploy backoffice web

on:
  push:
    branches: [main]
    paths:
      - "webApp/**"
      - "backofficeCore/**"
      - "shared/**"
      - "gradle/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - ".github/workflows/deploy-backoffice-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Wasm distribution
        env:
          IMUFLUX_FIREBASE_API_KEY: ${{ secrets.IMUFLUX_FIREBASE_API_KEY }}
          IMUFLUX_FIREBASE_PROJECT_ID: ${{ secrets.IMUFLUX_FIREBASE_PROJECT_ID }}
        run: ./gradlew :webApp:wasmJsBrowserDistribution --no-daemon

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: webApp/build/dist/wasmJs/productionExecutable

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
